service: gigs

image: kothacles/gigs

servers:
  web:
    - jigglypuff

proxy:
  ssl: false
  # kamal-proxy connects to your container over port 80, which is where Thruster
  # listens; it proxies on to Puma at 3000. Pointing this back at 3000 would skip
  # Thruster and lose compression.
  app_port: 80

registry:
  username: kothacles
  # Pulled from .kamal/secrets.
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    RUBY_VERSION: <%= File.read(".ruby-version").strip %>

env:
  secret:
    - RAILS_MASTER_KEY

ssh:
  user: ubuntu

# Serve the previous release's fingerprinted assets alongside the new ones, so
# pages loaded just before a deploy don't 404 on their CSS and JS.
asset_path: /rails/public/assets
