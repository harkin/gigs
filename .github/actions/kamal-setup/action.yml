name: Set up kamal
description: Install Ruby and kamal, and give the runner SSH access to the production server.

inputs:
  ssh-private-key:
    description: Deploy key for the server
    required: true
  ssh-host:
    description: Address of the server
    required: true

runs:
  using: composite
  steps:
    - name: Install Ruby (to run the kamal CLI)
      uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0

    - name: Install kamal (pinned to the version in Gemfile.lock)
      shell: bash
      run: gem install kamal -v "$(sed -n 's/^    kamal (\(.*\))$/\1/p' Gemfile.lock)"

    - name: Load the SSH deploy key into an agent
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
      run: |
        eval "$(ssh-agent -s)"
        # Export the agent socket so the later kamal step (which SSHes itself) can use it.
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
        ssh-add - <<< "$SSH_PRIVATE_KEY"

    - name: Teach the runner how to reach the server
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh-host }}
      run: |
        mkdir -p ~/.ssh
        cat >> ~/.ssh/config <<EOF
        Host jigglypuff
          HostName $SSH_HOST
          User ubuntu
          StrictHostKeyChecking accept-new
        EOF
