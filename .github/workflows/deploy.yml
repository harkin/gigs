name: Deploy

# Auto-deploy on every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
    # Skip deploys for commits that only touch non-app files. (Workflow changes
    # are NOT excluded, so Dependabot action bumps still get deploy-tested.)
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

# Collapse overlapping deploys to "just deploy the latest" so two runs never
# race for kamal's deploy lock.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# Least privilege: this job only needs to read the repo to check it out.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up kamal
        uses: ./.github/actions/kamal-setup
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-host: ${{ secrets.SSH_HOST }}

      - name: Set up Docker Buildx (kamal builds the image here)
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Deploy with kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: kamal deploy
