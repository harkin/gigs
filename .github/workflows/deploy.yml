name: Deploy

# Auto-deploy on every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Collapse overlapping deploys to "just deploy the latest" so two runs never
# race for kamal's deploy lock.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# Least privilege: this job only needs to read the repo to check it out.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Install Ruby (to run the kamal CLI)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"

      - name: Install kamal (pinned to the version in Gemfile.lock)
        run: gem install kamal -v 2.11.0

      - name: Set up Docker Buildx (kamal builds the image here)
        uses: docker/setup-buildx-action@v4

      - name: Load the SSH deploy key into the agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Teach the runner how to reach the server
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host jigglypuff
            HostName ${{ secrets.SSH_HOST }}
            User ubuntu
            StrictHostKeyChecking accept-new
          EOF

      - name: Deploy with kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: kamal deploy
