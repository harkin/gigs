name: Deploy

# Auto-deploy on every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
    # Skip deploys for commits that only touch non-app files. (Workflow changes
    # are NOT excluded, so Dependabot action bumps still get deploy-tested.)
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

# Collapse overlapping deploys to "just deploy the latest" so two runs never
# race for kamal's deploy lock.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# Least privilege: this job only needs to read the repo to check it out.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # MySQL 8.4 to match production (PlanetScale runs MySQL 8.4).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      # Single source of truth for checks: db prepare, Tailwind build, importmap
      # audit, and tests all live in config/ci.rb (also runnable locally).
      - name: Run CI checks
        run: bin/ci

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ruby (to run the kamal CLI)
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: "4.0.5"

      - name: Install kamal (pinned to the version in Gemfile.lock)
        run: gem install kamal -v 2.11.0

      - name: Set up Docker Buildx (kamal builds the image here)
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Load the SSH deploy key into an agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          # Export the agent socket so the later kamal step (which SSHes itself) can use it.
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "$SSH_PRIVATE_KEY"

      - name: Teach the runner how to reach the server
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host jigglypuff
            HostName ${{ secrets.SSH_HOST }}
            User ubuntu
            StrictHostKeyChecking accept-new
          EOF

      - name: Deploy with kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: kamal deploy
