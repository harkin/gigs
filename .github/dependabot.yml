version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current: Dependabot opens a weekly PR that
  # bumps the pinned commit SHA and updates the trailing "# version" comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 7 days after a release before proposing it, so any issues (including a
    # compromised release, historically caught within ~2 days) have time to
    # surface. Cooldown delays version updates only — security updates for a
    # known advisory are still proposed immediately.
    cooldown:
      default-days: 7
